[package]
name = "island-macos"
description = "The island as a native macOS app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "island"
path = "src/main.rs"

[dependencies]
island-core = { path = "../../crates/island-core" }

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
