name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test 'test/*.test.mjs'

  # The core's golden vectors (test/vectors/*.json) and the rest of its tests,
  # on Linux too: island-core has no OS dependencies.
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - run: cargo test -p island-core --locked

  qml:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true
          install-deps: false
      - run: qmltestrunner -input test/qml/tst_focus.qml
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
